# Render Blueprint for preview/testing. The free PostgreSQL database expires
# after 30 days; upgrade it before storing user data you need to retain.
services:
  - type: web
    name: dockerpilot-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run db:generate --workspace @dockerpilot/backend && npm run build --workspace @dockerpilot/backend && npm run db:deploy --workspace @dockerpilot/backend
    startCommand: npm run start --workspace @dockerpilot/backend
    healthCheckPath: /api/health/ready
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dockerpilot-db
          property: connectionString

  - type: web
    name: dockerpilot-frontend
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace @dockerpilot/frontend
    staticPublishPath: frontend/dist
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: dockerpilot-db
    databaseName: dockerpilot
    user: dockerpilot
    region: singapore
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
