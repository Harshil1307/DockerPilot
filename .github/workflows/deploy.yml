name: DockerPilot Production Delivery

on:
  workflow_run:
    workflows: [DockerPilot CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-delivery
  cancel-in-progress: false

jobs:
  publish-images:
    name: Build and publish GHCR images
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set image owner
        id: image-owner
        shell: bash
        run: printf 'owner=%s\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image-owner.outputs.owner }}/dockerpilot-frontend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image-owner.outputs.owner }}/dockerpilot-backend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy-source-services:
    name: Deploy Render and Vercel source builds
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out selected production commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Confirm deployment hooks are configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" || -z "$VERCEL_DEPLOY_HOOK_URL" ]]; then
            echo "::error::Configure RENDER_DEPLOY_HOOK_URL and VERCEL_DEPLOY_HOOK_URL in GitHub repository secrets."
            exit 1
          fi

      - name: Trigger Render source deployment for this commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *\?* ]]; then separator='&'; else separator='?'; fi
          curl --fail --silent --show-error --max-time 30 \
            --request POST \
            --output /dev/null \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${GITHUB_SHA}"

      - name: Wait for Render API readiness
        env:
          API_BASE_URL: https://dockerpilot-api.onrender.com
        shell: bash
        run: |
          for attempt in $(seq 1 40); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$API_BASE_URL/api/health/ready" || true)
            if [[ "$status" == "200" ]]; then
              echo "Render readiness check passed."
              exit 0
            fi
            echo "Render readiness check attempt ${attempt}/40 returned HTTP ${status:-000}."
            sleep 15
          done
          echo "::error::Render API did not become ready within 10 minutes."
          exit 1

      - name: Trigger Vercel source deployment
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --request POST \
            --output /dev/null \
            "$VERCEL_DEPLOY_HOOK_URL"

      - name: Verify Vercel frontend and API rewrite
        env:
          FRONTEND_URL: https://docker-pilot.vercel.app
        shell: bash
        run: |
          frontend_ready=false
          api_ready=false
          for attempt in $(seq 1 40); do
            frontend_status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$FRONTEND_URL/" || true)
            api_status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$FRONTEND_URL/api/health/ready" || true)
            if [[ "$frontend_status" == "200" ]]; then frontend_ready=true; fi
            if [[ "$api_status" == "200" ]]; then api_ready=true; fi
            if [[ "$frontend_ready" == true && "$api_ready" == true ]]; then
              echo "Vercel frontend and API rewrite health checks passed."
              exit 0
            fi
            echo "Vercel checks attempt ${attempt}/40: frontend HTTP ${frontend_status:-000}, API rewrite HTTP ${api_status:-000}."
            sleep 15
          done
          echo "::error::Vercel frontend or API rewrite health check failed."
          exit 1
